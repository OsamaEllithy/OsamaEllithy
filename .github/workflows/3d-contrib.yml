name: 3D Contribution Calendar

on:
  schedule:
    # 18:00 UTC daily
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # SETTING_JSON: ./profile-3d-settings.json

      - name: Commit generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all profile-3d-contrib
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(3d): refresh contribution calendar"
          git push

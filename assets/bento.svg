<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Tech stack, education, location, services and values">
  <title>Stack, background and services</title>
  <style>
    .f{font-family:"Segoe UI",Inter,-apple-system,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
    .card{fill:#161B22;stroke:#30363D}
    .lbl{font-size:10.5px;letter-spacing:1.3px;fill:#6E7681}
    .h{font-size:15px;font-weight:600;fill:#E6EDF3}
    .t{font-size:13px;fill:#9EA7B3}
    .chip{fill:#0D1117;stroke:#30363D}
    .chipt{font-size:12px;fill:#C9D1D9}
    .meta{font-size:11px;fill:#6E7681}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .r1{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
    .r2{animation:up .6s cubic-bezier(.2,.8,.2,1) .12s both}
    .r3{animation:up .6s cubic-bezier(.2,.8,.2,1) .24s both}
    .r4{animation:up .6s cubic-bezier(.2,.8,.2,1) .36s both}
    @keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
    .dot{animation:blip 2.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.r1,.r2,.r3,.r4,.dot{animation:none}}
  </style>

  <rect width="1000" height="440" fill="#0D1117"/>

  <!-- ── row 1 ── -->
  <g class="r1">
    <!-- stack -->
    <rect class="card" x="0.5" y="0.5" width="611" height="149" rx="14"/>
    <text class="f lbl" x="24" y="34">TECH STACK</text>

    <g class="chip">
      <rect x="24"  y="56" width="62"  height="30" rx="8"/>
      <rect x="96"  y="56" width="54"  height="30" rx="8"/>
      <rect x="160" y="56" width="96"  height="30" rx="8"/>
      <rect x="266" y="56" width="66"  height="30" rx="8"/>
      <rect x="342" y="56" width="52"  height="30" rx="8"/>
      <rect x="404" y="56" width="76"  height="30" rx="8"/>
      <rect x="24"  y="96" width="80"  height="30" rx="8"/>
      <rect x="114" y="96" width="80"  height="30" rx="8"/>
      <rect x="204" y="96" width="104" height="30" rx="8"/>
      <rect x="318" y="96" width="54"  height="30" rx="8"/>
      <rect x="382" y="96" width="86"  height="30" rx="8"/>
      <rect x="478" y="96" width="96"  height="30" rx="8"/>
    </g>
    <g class="m chipt" text-anchor="middle">
      <text x="55"  y="75">HTML</text>
      <text x="123" y="75">CSS</text>
      <text x="208" y="75">JavaScript</text>
      <text x="299" y="75">React</text>
      <text x="368" y="75">Git</text>
      <text x="442" y="75">MySQL</text>
      <text x="64"  y="115">Node.js</text>
      <text x="154" y="115">Express</text>
      <text x="256" y="115">WordPress</text>
      <text x="345" y="115">PHP</text>
      <text x="425" y="115">Tailwind</text>
      <text x="526" y="115">Bootstrap</text>
    </g>

    <!-- education -->
    <rect class="card" x="632.5" y="0.5" width="367" height="69" rx="14"/>
    <text class="f lbl" x="656" y="28">STUDYING</text>
    <text class="f h"   x="656" y="50">Computer Science</text>
    <text class="f meta" x="656" y="50" dx="152">· Suez Canal University</text>

    <!-- location -->
    <rect class="card" x="632.5" y="80.5" width="367" height="69" rx="14"/>
    <text class="f lbl" x="656" y="108">BASED IN</text>
    <text class="f h"   x="656" y="130">Egypt</text>
    <text class="f meta" x="656" y="130" dx="56">· client work in Saudi Arabia</text>
  </g>

  <!-- ── row 2: services ── -->
  <g class="r2">
    <rect class="card" x="0.5" y="170.5" width="319" height="149" rx="14"/>
    <text class="f lbl" x="24" y="200">SERVICE</text>
    <text class="f h"   x="24" y="226">Web development</text>
    <text class="f t"   x="24" y="252">Business websites and web apps</text>
    <text class="f t"   x="24" y="272">that stay fast and maintainable.</text>
    <text class="m meta" x="24" y="300">React · Node · Express</text>
  </g>
  <g class="r3">
    <rect class="card" x="340.5" y="170.5" width="319" height="149" rx="14"/>
    <text class="f lbl" x="364" y="200">SERVICE</text>
    <text class="f h"   x="364" y="226">WordPress &amp; CMS</text>
    <text class="f t"   x="364" y="252">Themes, plugins and content</text>
    <text class="f t"   x="364" y="272">clients can run on their own.</text>
    <text class="m meta" x="364" y="300">WordPress · PHP · MySQL</text>
  </g>
  <g class="r4">
    <rect class="card" x="680.5" y="170.5" width="319" height="149" rx="14"/>
    <text class="f lbl" x="704" y="200">SERVICE</text>
    <text class="f h"   x="704" y="226">Performance &amp; SEO</text>
    <text class="f t"   x="704" y="252">Core Web Vitals, on-page SEO</text>
    <text class="f t"   x="704" y="272">and UI/UX that moves numbers.</text>
    <text class="m meta" x="704" y="300">Lighthouse · SEO · UI/UX</text>
  </g>

  <!-- ── row 3: values ── -->
  <g class="r4">
    <text class="f lbl" x="500" y="348" text-anchor="middle">WHAT I VALUE</text>
    <rect class="card" x="0.5"   y="362.5" width="234" height="76" rx="14"/>
    <rect class="card" x="255.5" y="362.5" width="234" height="76" rx="14"/>
    <rect class="card" x="510.5" y="362.5" width="234" height="76" rx="14"/>
    <rect class="card" x="765.5" y="362.5" width="234" height="76" rx="14"/>
    <g class="f t" text-anchor="middle" fill="#C9D1D9">
      <text x="117" y="398">Clean architecture</text>
      <text x="372" y="398">Usability first</text>
      <text x="627" y="398">Performance minded</text>
      <text x="882" y="398">Open for freelance</text>
    </g>
    <g class="f meta" text-anchor="middle">
      <text x="117" y="418">readable, testable code</text>
      <text x="372" y="418">built for real people</text>
      <text x="627" y="418">every millisecond counts</text>
      <text x="882" y="418" dx="9">available for new work</text>
    </g>
    <circle class="dot" cx="812" cy="414" r="4" fill="#3FB950"/>
  </g>
</svg>

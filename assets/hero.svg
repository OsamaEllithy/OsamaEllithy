<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Hello, I'm Osama — full-stack web developer">
  <title>Hello, I'm Osama</title>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56D4F0"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="400" rx="20"/></clipPath>
  </defs>

  <style>
    .f{font-family:"Segoe UI",Inter,-apple-system,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .a1{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .a2{animation:up .7s cubic-bezier(.2,.8,.2,1) .15s both}
    .a3{animation:up .7s cubic-bezier(.2,.8,.2,1) .3s both}
    .a4{animation:up .7s cubic-bezier(.2,.8,.2,1) .45s both}
    @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
    .glow{animation:breathe 7s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .orbit{animation:spin 14s linear infinite;transform-origin:0 0}
    @media (prefers-reduced-motion:reduce){.a1,.a2,.a3,.a4,.glow,.orbit{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="400" fill="#0D1117"/>
    <ellipse class="glow" cx="500" cy="120" rx="420" ry="190" fill="url(#glow)"/>

    <!-- device frames -->
    <g class="a1">
      <!-- JS · tablet -->
      <rect x="310" y="106" width="56" height="44" rx="8" fill="#161B22" stroke="#30363D"/>
      <text class="m" x="338" y="134" font-size="17" font-weight="700" fill="#F7DF1E" text-anchor="middle">JS</text>

      <!-- React · monitor -->
      <rect x="394" y="72" width="104" height="78" rx="10" fill="#161B22" stroke="#30363D"/>
      <g transform="translate(446,111)">
        <g class="orbit">
          <ellipse rx="27" ry="10.5" fill="none" stroke="#61DAFB" stroke-width="2"/>
          <ellipse rx="27" ry="10.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(60)"/>
          <ellipse rx="27" ry="10.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(120)"/>
        </g>
        <circle r="4.5" fill="#61DAFB"/>
      </g>

      <!-- Node · monitor -->
      <rect x="526" y="80" width="92" height="70" rx="10" fill="#161B22" stroke="#30363D"/>
      <g transform="translate(572,115)">
        <path d="M0 -24 L21 -12 L21 12 L0 24 L-21 12 L-21 -12 Z" fill="none" stroke="#5FA04E" stroke-width="2"/>
        <text class="m" x="0" y="5" font-size="13" font-weight="700" fill="#5FA04E" text-anchor="middle">JS</text>
      </g>

      <!-- WordPress · phone -->
      <rect x="646" y="84" width="44" height="66" rx="9" fill="#161B22" stroke="#30363D"/>
      <g transform="translate(668,117)">
        <circle r="15" fill="none" stroke="#3B9ED4" stroke-width="2"/>
        <text class="f" x="0" y="6" font-size="16" font-weight="700" fill="#3B9ED4" text-anchor="middle">W</text>
      </g>
    </g>

    <!-- name -->
    <text class="f a2" x="500" y="242" font-size="52" font-weight="600" fill="#E6EDF3" text-anchor="middle" letter-spacing="-1">Hello, I&#39;m</text>
    <text class="f a3" x="500" y="308" font-size="52" font-weight="700" fill="url(#name)" text-anchor="middle" letter-spacing="-1">Osama.</text>

    <g class="a4">
      <text class="m" x="500" y="352" font-size="15" fill="#8B949E" text-anchor="middle">full-stack web developer · WordPress &amp; CMS</text>
    </g>

    <rect x="0.5" y="0.5" width="999" height="399" rx="20" fill="none" stroke="#30363D"/>
  </g>
</svg>

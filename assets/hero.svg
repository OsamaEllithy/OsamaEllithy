<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Animated profile header">
  <title>Animated profile header</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070E"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="aurA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6F6FF"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Segoe UI", Inter, -apple-system, Helvetica, Arial, sans-serif; }

    @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(70px,26px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-80px,-22px) } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(40px,-34px) } }
    .aur1 { animation: drift1 14s ease-in-out infinite; }
    .aur2 { animation: drift2 18s ease-in-out infinite; }
    .aur3 { animation: drift3 22s ease-in-out infinite; }

    @keyframes spin  { to { transform: rotate(360deg) } }
    @keyframes rspin { to { transform: rotate(-360deg) } }
    .s1 { animation: spin 7s linear infinite; }
    .s2 { animation: rspin 11s linear infinite; }
    .s3 { animation: spin 16s linear infinite; }

    @keyframes breathe { 0%,100% { opacity: .35 } 50% { opacity: .95 } }
    .ring { fill: none; stroke-width: 1.6; animation: breathe 6s ease-in-out infinite; }

    @keyframes corePulse { 0%,100% { r: 15; opacity: .9 } 50% { r: 19; opacity: 1 } }
    .core { animation: corePulse 3.4s ease-in-out infinite; }
    @keyframes haloPulse { 0%,100% { opacity: .12; transform: scale(1) } 50% { opacity: .3; transform: scale(1.18) } }
    .halo { animation: haloPulse 3.4s ease-in-out infinite; transform-origin: 798px 140px; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .in1 { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .in2 { animation: rise .9s cubic-bezier(.2,.8,.2,1) .18s both; }
    .in3 { animation: rise .9s cubic-bezier(.2,.8,.2,1) .34s both; }
    .in4 { animation: rise .9s cubic-bezier(.2,.8,.2,1) .5s both; }

    @keyframes blink { 0%,45% { opacity: 1 } 50%,95% { opacity: 0 } 100% { opacity: 1 } }
    .caret { animation: blink 1.1s steps(1) infinite; }

    @keyframes dash { to { stroke-dashoffset: -400 } }
    .wire { animation: dash 9s linear infinite; }

    @keyframes float { 0%,100% { transform: translateY(0); opacity: .35 } 50% { transform: translateY(-16px); opacity: .9 } }
    .p { animation: float 7s ease-in-out infinite; }

    @keyframes slide { 0% { transform: translateX(-420px) } 100% { transform: translateX(1000px) } }
    .sweep { animation: slide 7.5s ease-in-out infinite; }

    @keyframes gridPulse { 0%,100% { opacity: .18 } 50% { opacity: .42 } }
    .grid { animation: gridPulse 8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .aur1,.aur2,.aur3,.s1,.s2,.s3,.ring,.core,.halo,.caret,.wire,.p,.sweep,.grid,
      .in1,.in2,.in3,.in4 { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1000" height="280" fill="url(#sky)"/>

    <g filter="url(#soft)">
      <circle class="aur1" cx="180" cy="70"  r="150" fill="url(#aurA)"/>
      <circle class="aur2" cx="860" cy="210" r="170" fill="url(#aurB)"/>
      <circle class="aur3" cx="520" cy="30"  r="140" fill="url(#aurC)"/>
    </g>

    <!-- isometric floor -->
    <g class="grid" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="0.8" fill="none">
      <path d="M-100 252 L1100 252 M-100 238 L1100 238 M-60 224 L1060 224 M-20 212 L1020 212 M20 202 L980 202"/>
      <path d="M60 280 L300 196 M180 280 L380 196 M300 280 L460 196 M420 280 L540 196 M540 280 L620 196 M660 280 L700 196 M780 280 L780 196 M900 280 L860 196 M1020 280 L940 196"/>
    </g>

    <!-- 3D orbit system -->
    <g transform="translate(798,140)">
      <circle class="halo" cx="0" cy="0" r="74" fill="#22D3EE" transform-origin="0 0" style="transform-origin:0 0"/>
      <g transform="rotate(-20)">
        <ellipse class="ring" rx="118" ry="40" stroke="url(#ringA)"/>
        <g class="s1"><circle cx="118" cy="0" r="5" fill="#67E8F9" filter="url(#glow)"/></g>
      </g>
      <g transform="rotate(42)">
        <ellipse class="ring" rx="98" ry="34" stroke="url(#ringB)"/>
        <g class="s2"><circle cx="98" cy="0" r="4.2" fill="#D8B4FE" filter="url(#glow)"/></g>
      </g>
      <g transform="rotate(84)">
        <ellipse class="ring" rx="136" ry="30" stroke="url(#ringC)"/>
        <g class="s3"><circle cx="136" cy="0" r="3.6" fill="#93C5FD" filter="url(#glow)"/></g>
      </g>
      <circle class="core" cx="0" cy="0" r="15" fill="#E0F7FF" filter="url(#glow)"/>
      <circle cx="-5" cy="-5" r="4" fill="#22D3EE" opacity="0.9"/>
    </g>

    <!-- copy -->
    <g class="sans">
      <g class="in1">
        <rect x="56" y="54" width="180" height="26" rx="13" fill="#0EA5E9" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
        <circle cx="72" cy="67" r="3.4" fill="#34D399"/>
        <text class="mono" x="86" y="71" font-size="12" fill="#7DD3FC" letter-spacing="1.4">OPEN FOR FREELANCE</text>
      </g>
      <text class="in2" x="56" y="140" font-size="48" font-weight="700" fill="url(#ink)" letter-spacing="-1">OSAMA ABDELNASER</text>
      <text class="in3 mono" x="56" y="176" font-size="17" fill="#94A3B8">full-stack web developer · WordPress &amp; CMS</text>
      <g class="in4">
        <text class="mono" x="56" y="212" font-size="14" fill="#64748B">$ whoami --build</text>
        <rect class="caret" x="200" y="200" width="8" height="15" fill="#22D3EE"/>
      </g>
    </g>

    <!-- wire accent -->
    <path class="wire" d="M56 240 C 220 240 260 196 420 196 C 560 196 600 240 760 240"
          fill="none" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.4"
          stroke-dasharray="10 14" stroke-linecap="round"/>

    <!-- particles -->
    <g fill="#67E8F9">
      <circle class="p" cx="330" cy="70"  r="2.2" style="animation-delay:0s"/>
      <circle class="p" cx="400" cy="120" r="1.6" style="animation-delay:.6s"/>
      <circle class="p" cx="470" cy="60"  r="2.6" style="animation-delay:1.2s"/>
      <circle class="p" cx="560" cy="150" r="1.8" style="animation-delay:1.8s"/>
      <circle class="p" cx="620" cy="80"  r="2.2" style="animation-delay:2.4s"/>
      <circle class="p" cx="950" cy="60"  r="1.8" style="animation-delay:3s" fill="#D8B4FE"/>
      <circle class="p" cx="270" cy="170" r="1.6" style="animation-delay:3.6s" fill="#D8B4FE"/>
      <circle class="p" cx="700" cy="40"  r="1.8" style="animation-delay:4.2s"/>
    </g>

    <rect class="sweep" x="0" y="0" width="420" height="280" fill="url(#sweep)"/>
    <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.22"/>
  </g>
</svg>
